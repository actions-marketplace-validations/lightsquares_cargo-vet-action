name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  existing-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          working-directory: tests/existing-store

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          working-directory: tests/bootstrap

  unvetted-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: vet
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/unvetted
          registries: ""
      - if: steps.vet.outcome != 'failure'
        run: |
          echo "expected cargo vet to fail for an unvetted dependency"
          exit 1

  unvetted-warns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          working-directory: tests/unvetted
          registries: ""
          unsafe-only-report-warnings: "true"
