# main builds the newest supported cargo-vet. Every other version lives on a
# branch build/cargo-vet-<version> with its own copy of this file and of
# build.sh (see README).
[source]
head = "main"
shallow = true

[build]
path = "docker/Dockerfile"
build_cmd = "./build.sh"
artifacts = [
  "dist/cargo-vet-0.10.2-x86_64-unknown-linux-musl",
]
